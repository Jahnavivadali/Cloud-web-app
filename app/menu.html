<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Menu Card</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f4f4;
        display: flex;
        justify-content: center;
        padding: 30px;
    }

    .menu-card {
        width: 350px;
        background: white;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    }

    h1 {
        text-align: center;
        color: #333;
        margin-bottom: 10px;
    }

    h2 {
        border-bottom: 2px solid #eee;
        padding-bottom: 5px;
        margin-top: 20px;
        color: #444;
    }

    .item {
        display: flex;
        justify-content: space-between;
        margin: 8px 0;
        font-size: 16px;
    }

    .price {
        color: green;
        font-weight: bold;
    }

    .footer {
        text-align: center;
        margin-top: 20px;
        font-size: 14px;
        color: #777;
    }
</style>
</head>
<body>

<div class="menu-card">
    <h1>My Restaurant</h1>

    <h2>Starters</h2>
    <div class="item"><span>Soup</span><span class="price">₹80</span></div>
    <div class="item"><span>Paneer Tikka</span><span class="price">₹150</span></div>
    <div class="item"><span>Spring Rolls</span><span class="price">₹120</span></div>

    <h2>Main Course</h2>
    <div class="item"><span>Veg Biryani</span><span class="price">₹180</span></div>
    <div class="item"><span>Butter Naan & Curry</span><span class="price">₹200</span></div>
    <div class="item"><span>Fried Rice</span><span class="price">₹160</span></div>

    <h2>Desserts</h2>
    <div class="item"><span>Ice Cream</span><span class="price">₹70</span></div>
    <div class="item"><span>Gulab Jamun</span><span class="price">₹60</span></div>

    <div class="footer">Thank you & Visit Again!</div>
</div>

</body>
</html>
